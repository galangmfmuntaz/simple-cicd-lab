name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t simple-cicd-app:latest .
      
      - name: Run Container
        run: docker run -d -p 5000:5000 --name flask-test simple-cicd-app:latest
      
      - name: Wait for Server to Start
        run: sleep 5
      
      - name: Test Server with curl
        run: curl http://localhost:5000
